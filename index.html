<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Productivity Web App - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="app-title">✓ Smart Productivity</h1>
        <p class="subtitle">Organize your tasks, amplify your focus</p>
      </div>
      
      <form onsubmit="login(event)" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required autofocus>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <p class="error-message" id="error"></p>
        
        <p class="hint-text">📝 Demo Credentials:<br>Username: <strong>admin</strong><br>Password: <strong>1234</strong></p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
